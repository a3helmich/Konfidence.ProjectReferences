name: $(date:yyyyMMdd)$(rev:.r)

trigger:
  batch: false
  branches:
    include:
    - develop

schedules:
- cron: '0 4 * * *'  # 05:00 W. Europe Standard Time (UTC+1)
  displayName: Nightly publish to GitHub
  branches:
    include:
    - develop
  always: true

resources:
  repositories:
  - repository: templates
    type: git
    name: Konfidence/yaml.Templates
    ref: refs/heads/develop

variables:
- group: GitHubTokens

pool:
  name: Default

steps:
- checkout: self
  clean: true
  fetchDepth: 0

- template: PublishKonfidenceToGithub.yml@templates
