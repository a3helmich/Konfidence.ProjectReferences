pool:
  name: Default

trigger: none

schedules:
- cron: "0 3 * * *"
  displayName: nightly build
  branches:
    include: 
    - develop
  always: true

resources:
  repositories:
    - repository: templates
      type: git
      name: Konfidence/yaml.Templates
      ref: refs/heads/develop
 
variables:
  - template: ComputeVersion.yml@templates
    parameters:
      majorVersion: 2
  - name: disable.coverage.autogenerate
    value: 'false'
  - name: solution
    value: '**/*.sln'
  - name: buildConfiguration
    value: 'Release'
  - group: nuget.org-apikeys
  - name: vNuGetApiKey
    value: $[variables.NuGetApiKey]
  
steps:
- checkout: self
  clean: true

- template: VerifyVersionMatchesProps.yml@templates

- task: DotNetCoreCLI@2
  displayName: 'dotnet restore'
  inputs:
    command: restore
    projects: '$(solution)'
    feedsToUse: config
    nugetConfigPath: .nuget/NuGet.Config
    verbosityRestore: Normal

- task: DotNetCoreCLI@2
  displayName: 'dotnet build'
  inputs:
    projects: '$(solution)'
    arguments: '-c $(BuildConfiguration) --no-restore /p:Version=$(year).$(majorVersion).$(minorVersion)'

- task: DotNetCoreCLI@2
  displayName: 'dotnet test'
  inputs:
    command: test
    projects: '$(solution)'
    arguments: '-c $(BuildConfiguration) --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings'
    publishTestResults: true

- template: GenerateAndPublishCodeCoverage.yml@templates  

- task: DotNetCoreCLI@2
  displayName: 'dotnet pack'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    command: pack
    packagesToPack: '$(solution)'
    nobuild: true
    verbosityPack: Normal
    buildProperties: 'Version=$(year).$(majorVersion).$(minorVersion)'

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish nuget.org package'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    command: custom
    custom: nuget
    arguments: 'push $(Build.ArtifactStagingDirectory)\Konfidence.Project-References.*.nupkg -s https://api.nuget.org/v3/index.json -k $(vNuGetApiKey) --skip-duplicate'
